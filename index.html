<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Launcher</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181c24;
      --border: #2a3140;
      --text: #eef1f7;
      --muted: #98a2b3;
      --accent: #4f8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .panel {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    .subtitle { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      background: rgba(79, 140, 255, 0.12);
      border: 1px solid rgba(79, 140, 255, 0.35);
      font-size: 0.9rem;
    }
    .banner.hidden { display: none; }
    .cancel-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .cancel-btn:hover { border-color: var(--text); }

    .version-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .version-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #131720;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s, transform 0.1s;
    }
    .version-item:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .version-meta { display: flex; flex-direction: column; gap: 3px; }
    .version-name { font-weight: 600; }
    .version-note { font-size: 0.82rem; color: var(--muted); }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>My App</h1>
    <p class="subtitle">Select a version to launch.</p>

    <div id="autoBanner" class="banner hidden">
      <span id="countdownText"></span>
      <button id="cancelBtn" class="cancel-btn" type="button">Cancel</button>
    </div>

    <div id="versionList" class="version-list"></div>
  </main>

  <script>
    // 1. Add new versions here (order doesn't matter—sorted automatically)
    const VERSIONS = [
      { id: "v1", file: "versions/v1.html", note: "Initial release" },
      { id: "v2", file: "versions/v2.html", note: "Bug fixes & layout update" },
      { id: "v3", file: "versions/v3.html", note: "Latest build" }
    ];

    // Delay in seconds before auto-launching the highest version (set to 0 for instant)
    const AUTO_LAUNCH_SECONDS = 3;

    // Sort highest version first using numeric comparison (v10 > v2)
    const sortedVersions = [...VERSIONS].sort((a, b) =>
      b.id.localeCompare(a.id, undefined, { numeric: true, sensitivity: "base" })
    );
    const latest = sortedVersions[0];

    const params = new URLSearchParams(window.location.search);
    const requestedVersion = params.get("v");
    const forceSelector = params.has("select");

    // Detect if the user arrived here via the browser Back button
    const navEntry = performance.getEntriesByType("navigation")[0];
    const cameFromBack = navEntry && navEntry.type === "back_forward";

    // Support direct links like ?v=v2
    if (requestedVersion) {
      const match = sortedVersions.find(
        (v) => v.id.toLowerCase() === requestedVersion.toLowerCase()
      );
      if (match) window.location.replace(match.file);
    }

    // Render version list
    const listEl = document.getElementById("versionList");
    sortedVersions.forEach((v, index) => {
      const link = document.createElement("a");
      link.className = "version-item";
      link.href = v.file;
      link.innerHTML = `
        <div class="version-meta">
          <span class="version-name">${v.id}</span>
          ${v.note ? `<span class="version-note">${v.note}</span>` : ""}
        </div>
        ${index === 0 ? `<span class="badge">Latest</span>` : ""}
      `;
      link.addEventListener("click", stopCountdown);
      listEl.appendChild(link);
    });

    // Auto-launch countdown logic
    const bannerEl = document.getElementById("autoBanner");
    const countdownText = document.getElementById("countdownText");
    const cancelBtn = document.getElementById("cancelBtn");
    let timerId = null;

    function stopCountdown() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      bannerEl.classList.add("hidden");
    }

    cancelBtn.addEventListener("click", stopCountdown);

    // Stop countdown if restored from browser back/forward cache
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) stopCountdown();
    });

    if (latest && !forceSelector && !cameFromBack && !requestedVersion) {
      if (AUTO_LAUNCH_SECONDS <= 0) {
        window.location.href = latest.file;
      } else {
        let remaining = AUTO_LAUNCH_SECONDS;
        bannerEl.classList.remove("hidden");
        countdownText.textContent = `Launching ${latest.id} in ${remaining}s…`;

        timerId = setInterval(() => {
          remaining -= 1;
          if (remaining <= 0) {
            stopCountdown();
            window.location.href = latest.file;
          } else {
            countdownText.textContent = `Launching ${latest.id} in ${remaining}s…`;
          }
        }, 1000);
      }
    }
  </script>
</body>
</html>
