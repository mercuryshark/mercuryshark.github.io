<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Launcher</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181c24;
      --border: #2a3140;
      --text: #eef1f7;
      --muted: #98a2b3;
      --accent: #4f8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .panel {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    .subtitle { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      background: rgba(79, 140, 255, 0.12);
      border: 1px solid rgba(79, 140, 255, 0.35);
      font-size: 0.9rem;
    }
    .banner.hidden, .status.hidden { display: none; }
    .cancel-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .cancel-btn:hover { border-color: var(--text); }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 14px 0;
    }
    .version-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .version-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #131720;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s, transform 0.1s;
    }
    .version-item:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .version-name { font-weight: 600; }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>My App</h1>
    <p class="subtitle">Select a version to launch.</p>

    <div id="autoBanner" class="banner hidden">
      <span id="countdownText"></span>
      <button id="cancelBtn" class="cancel-btn" type="button">Cancel</button>
    </div>

    <div id="status" class="status">Loading versions…</div>
    <div id="versionList" class="version-list"></div>
  </main>

  <script>
    // Delay in seconds before auto-launching the highest version (set to 0 for instant)
    const AUTO_LAUNCH_SECONDS = 3;
    const VERSIONS_DIR = "versions";

    const bannerEl = document.getElementById("autoBanner");
    const countdownText = document.getElementById("countdownText");
    const cancelBtn = document.getElementById("cancelBtn");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("versionList");

    let timerId = null;

    function stopCountdown() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      bannerEl.classList.add("hidden");
    }

    cancelBtn.addEventListener("click", stopCountdown);
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) stopCountdown();
    });

    function sortVersions(list) {
      return [...list].sort((a, b) =>
        b.id.localeCompare(a.id, undefined, { numeric: true, sensitivity: "base" })
      );
    }

    // Primary source: versions.json generated by GitHub Actions
    async function loadFromManifest() {
      const res = await fetch("versions.json", { cache: "no-store" });
      if (!res.ok) throw new Error("versions.json not found");
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("Invalid versions.json");
      return data;
    }

    // Fallback source: GitHub Contents API (works automatically on *.github.io)
    async function loadFromGitHubAPI() {
      const host = window.location.hostname;
      if (!host.endsWith(".github.io")) {
        throw new Error("Not hosted on github.io");
      }

      const owner = host.split(".")[0];
      const parts = window.location.pathname.split("/").filter(Boolean);
      const firstSeg = parts[0];
      const repo =
        firstSeg && !firstSeg.endsWith(".html") ? firstSeg : `${owner}.github.io`;

      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${VERSIONS_DIR}`;
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);

      const items = await res.json();
      const versions = [];

      for (const item of items) {
        if (item.type === "file" && /\.html?$/i.test(item.name)) {
          versions.push({
            id: item.name.replace(/\.html?$/i, ""),
            file: `${VERSIONS_DIR}/${encodeURIComponent(item.name)}`
          });
        } else if (item.type === "dir") {
          versions.push({
            id: item.name,
            file: `${VERSIONS_DIR}/${encodeURIComponent(item.name)}/`
          });
        }
      }
      return versions;
    }

    async function init() {
      let versions = [];

      try {
        versions = await loadFromManifest();
      } catch {
        try {
          versions = await loadFromGitHubAPI();
        } catch {
          statusEl.textContent =
            "No versions found yet. Add HTML files to the versions/ folder and push to GitHub.";
          return;
        }
      }

      const sortedVersions = sortVersions(versions);
      if (sortedVersions.length === 0) {
        statusEl.textContent = "The versions/ folder is currently empty.";
        return;
      }

      statusEl.classList.add("hidden");
      const latest = sortedVersions[0];

      const params = new URLSearchParams(window.location.search);
      const requestedVersion = params.get("v");
      const forceSelector = params.has("select");

      const navEntry = performance.getEntriesByType("navigation")[0];
      const cameFromBack = navEntry && navEntry.type === "back_forward";

      if (requestedVersion) {
        const match = sortedVersions.find(
          (v) => v.id.toLowerCase() === requestedVersion.toLowerCase()
        );
        if (match) {
          window.location.replace(match.file);
          return;
        }
      }

      // Render version links
      sortedVersions.forEach((v, index) => {
        const link = document.createElement("a");
        link.className = "version-item";
        link.href = v.file;
        link.addEventListener("click", stopCountdown);

        const nameSpan = document.createElement("span");
        nameSpan.className = "version-name";
        nameSpan.textContent = v.id;
        link.appendChild(nameSpan);

        if (index === 0) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "Latest";
          link.appendChild(badge);
        }

        listEl.appendChild(link);
      });

      // Auto-launch highest version unless skipped
      if (!forceSelector && !cameFromBack && !requestedVersion) {
        if (AUTO_LAUNCH_SECONDS <= 0) {
          window.location.href = latest.file;
        } else {
          let remaining = AUTO_LAUNCH_SECONDS;
          bannerEl.classList.remove("hidden");
          countdownText.textContent = `Launching ${latest.id} in ${remaining}s…`;

          timerId = setInterval(() => {
            remaining -= 1;
            if (remaining <= 0) {
              stopCountdown();
              window.location.href = latest.file;
            } else {
              countdownText.textContent = `Launching ${latest.id} in ${remaining}s…`;
            }
          }, 1000);
        }
      }
    }

    init();
  </script>
</body>
</html>
